# Mac Mini production is deployed only by scripts/deploy-mac-mini-api.sh.
# No GitHub-hosted job connects to the Mac Mini or triggers Render deployments.
# Do NOT overwrite GHCR :main/:latest: the old AMD64 Render backend may still
# consume those legacy tags as an emergency fallback.
name: Board Game AI Lab CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend pytest (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend regression suite
        run: python -m pytest tests -q

  frontend-tests:
    name: React unit tests and Vite build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm test
      - name: Verify neutral Vite build (no production API secrets)
        run: npm run build

  arm64-image:
    name: Native ARM64 Docker build and smoke test
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 image (test only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: bgai-api:ci
      - name: Smoke-test the exact image and provenance
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect bgai-api:ci --format '{{.Architecture}}')" = arm64
          docker run -d --rm --name bgai-ci \
            -p 127.0.0.1:18000:8000 \
            -e PORT=8000 \
            -e EXPLANATIONS_ENABLED=false \
            -e VICTOR_RESEARCH_ENABLED=true \
            -e EVALUATION_SOURCE_COMMIT="$SOURCE_COMMIT" \
            bgai-api:ci
          trap 'docker logs --tail 100 bgai-ci || true; docker rm -f bgai-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:18000/v1/connect4/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:18000/v1/connect4/health | grep -qx OK
          curl -fsS --max-time 5 http://127.0.0.1:18000/v1/connect4/provenance \
            | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["source_commit"] == os.environ["SOURCE_COMMIT"]'
          curl -fsS --max-time 10 -X POST \
            http://127.0.0.1:18000/v1/connect4/start_game \
            -H 'Content-Type: application/json' \
            -d '{"player1":{"type":"human"},"player2":{"type":"negamax","depth":2}}' \
            | python3 -c 'import json,sys; game=json.load(sys.stdin); assert game["revision"] == 0 and game["game_id"]'
          echo 'PASS: ARM64 image, health, provenance, and game creation'

  publish-arm64:
    name: Publish immutable ARM64 image (never auto-deploy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [arm64-image]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only commit-pinned ARM64 tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:mac-arm64-sha-${{ github.sha }}
      # This workflow deliberately has NO Render deploy hook, SSH, Tailscale
      # credential, self-hosted runner, or API production deployment action.
