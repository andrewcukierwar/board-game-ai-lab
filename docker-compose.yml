# docker-compose.yml  (repo root)
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/connect4/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports: ["3000:80"]
